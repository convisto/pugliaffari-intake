name = "pugliaffari-vragenlijst"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Niet-geheime variabelen (al ingevuld):
[vars]
ALLOWED_ORIGIN = "*"
# Interne ontvangers (komma-gescheiden = meerdere ontvangers):
INTERNAL_EMAIL = "gianluca@pugliaffari.com, giuliano@pugliaffari.com"
NOTION_DATABASE_ID = "729f5e4c70a54fd980f1015752a766ec"
# FROM_EMAIL: verstuurd vanaf het (gratis) geverifieerde convisto.be-domein,
# met "Pugliaffari" als weergavenaam. Antwoorden gaan via reply-to naar ciao@pugliaffari.com.
# Werkt zodra convisto.be in Resend op "Verified" staat. Pas het lokale deel (aankoop@) gerust aan.
FROM_EMAIL = "Pugliaffari <aankoop@convisto.be>"
#
# Geheimen (RESEND_API_KEY, NOTION_TOKEN) NOOIT hier zetten —
# stel die in via `wrangler secret put` (zie README.md).
